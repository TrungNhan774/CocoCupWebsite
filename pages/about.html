<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CocoCup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header sẽ load ở đây -->
  <div id="header"></div>

  <!-- Nội dung chính -->
  <main class="container my-5">
    <div class="row align-items-center">
      <div class="col-md-5">
        <img src="../image/z7045172245217_a820479b21e5968f3ce0632e20e11902.jpg" class="img-fluid" alt="Coconut Leaf Cup">
      </div>
      <div class="col-md-7">
        <h2>GIỚI THIỆU VỀ CHÚNG TÔI</h2>
        <p><strong>Coconut Leaf Cup – 100% Tự nhiên</strong></p>
        <p>Chiếc cốc thân thiện môi trường được làm hoàn toàn từ lá dừa, an toàn cho sức khỏe và dễ dàng phân hủy sinh học. Đây là lựa chọn hoàn hảo thay thế nhựa dùng một lần, vừa tiện lợi, vừa góp phần bảo vệ hành tinh xanh.</p>
      </div>
    </div>
  </main>

  <!-- Footer sẽ load ở đây -->
  <div id="footer"></div>

<script>
  async function loadComponent(id, file) {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error("Không load được " + file);
      document.getElementById(id).innerHTML = await res.text();

      // 👉 Nếu vừa load header thì chạy highlight menu
      if (id === "header") {
        highlightMenu();
      }
    } catch (err) {
      console.error(err);
      document.getElementById(id).innerHTML = `<div class="text-danger">Lỗi khi tải ${file}</div>`;
    }
  }

  function highlightMenu() {
    const currentPath = window.location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll(".navbar-nav .nav-link").forEach(link => {
      const linkPath = link.getAttribute("href").split("/").pop();
      if (linkPath === currentPath) {
        link.classList.add("active");
      }
    });
  }

  loadComponent("header", "header.html");
  loadComponent("footer", "footer.html");
</script>




  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
